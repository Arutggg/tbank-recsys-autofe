# Линтер репозитория. Запуск: .venv/bin/ruff check .
line-length = 95
target-version = "py312"

[lint]
select = ["F", "E9", "B", "UP", "SIM", "I"]
ignore = [
  "E501",    # длина строки контролируется line-length выше
  "B905",    # zip(strict=) — в numpy-коде длины гарантированы формой массивов
  "SIM108",  # тернарники вместо if-else ухудшают читаемость в численном коде
]

[lint.per-file-ignores]
"experiments/*" = ["E402"]   # sys.path правится до импортов пакета намеренно
# В JIT-ядре движка явные сравнения вместо `in (a, b)`: это горячий цикл на
# сотни миллионов итераций, и членство в кортеже там и медленнее, и хуже
# поддержано numba.
"src/afe/engine.py" = ["SIM109"]
